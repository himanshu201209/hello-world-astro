const els = {
  title: document.getElementById("example-title"),
  duration: document.getElementById("example-duration"),
  desc: document.getElementById("example-desc"),
  flows: document.getElementById("flows"),
  thumb: document.getElementById("video-thumb"),
  pane: document.getElementById("video-pane"),
  embed: document.getElementById("video-embed"),
  play: document.getElementById("play-btn"),
  prev: document.getElementById("prev-btn"),
  next: document.getElementById("next-btn"),
  status: document.getElementById("slide-status"),
};

let index = 0;
let playing = false;

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isMobile() {
  return window.matchMedia("(max-width: 900px)").matches;
}

function syncFlowOpenState() {
  const openOnDesktop = !isMobile();
  els.flows.querySelectorAll("details.flow-col").forEach((el) => {
    el.open = openOnDesktop;
  });
}

function bindActionScrollFades() {
  els.flows.querySelectorAll(".actions-shell").forEach((shell) => {
    const wrap = shell.querySelector(".actions-wrap");
    if (!wrap || wrap.dataset.fadeBound === "1") return;
    wrap.dataset.fadeBound = "1";

    const update = () => {
      const atEnd =
        wrap.scrollHeight <= wrap.clientHeight + 4 ||
        wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 4;
      shell.classList.toggle("is-scrolled-end", atEnd);
    };

    wrap.addEventListener("scroll", update, { passive: true });
    requestAnimationFrame(update);
  });

  els.flows.querySelectorAll("details.flow-col").forEach((details) => {
    if (details.dataset.fadeToggleBound === "1") return;
    details.dataset.fadeToggleBound = "1";
    details.addEventListener("toggle", () => {
      requestAnimationFrame(() => {
        details.querySelectorAll(".actions-wrap").forEach((wrap) => {
          wrap.dispatchEvent(new Event("scroll"));
        });
      });
    });
  });
}

function renderFlow(flow) {
  const objects =
    flow.objects && flow.objects.length
      ? flow.objects.map((o) => `<span class="obj">${escapeHtml(o)}</span>`).join("")
      : `<p class="empty-note">Objects pending</p>`;

  const actions =
    flow.actions && flow.actions.length
      ? flow.actions
          .map(
            (a) => `
      <div class="action">
        <div class="action-rail" aria-hidden="true"></div>
        <div class="action-body">
          <div class="action-ts">${escapeHtml(a.ts)}</div>
          <p class="action-cap">${escapeHtml(a.cap)}</p>
        </div>
      </div>`
          )
          .join("")
      : `<p class="empty-note">Atomic action labels pending</p>`;

  return `
    <details class="flow-col">
      <summary>
        <div class="flow-summary-bar">
          <h2 class="flow-title">${escapeHtml(flow.title)}</h2>
          <svg class="flow-chevron" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </summary>
      <div class="flow-body">
        <div class="flow-head">
          <p class="flow-summary">${escapeHtml(flow.summary)}</p>
        </div>
        <div class="objects-box">
          <p class="objects-label">Objects identified</p>
          <div class="objs">${objects}</div>
        </div>
        <p class="actions-label">Atomic action labels</p>
        <div class="actions-shell">
          <div class="actions-wrap">
            <div class="actions">
              <div class="actions-inner">
                <div class="timeline-line" aria-hidden="true"></div>
                ${actions}
              </div>
            </div>
          </div>
          <div class="actions-fade" aria-hidden="true"></div>
        </div>
      </div>
    </details>`;
}

function stopVideo() {
  playing = false;
  els.pane.classList.remove("is-playing");
  els.embed.hidden = true;
  els.embed.innerHTML = "";
}

function playVideo() {
  const example = EXAMPLES[index];
  playing = true;
  els.pane.classList.add("is-playing");
  els.embed.hidden = false;

  if (example.vimeo) {
    els.embed.innerHTML = `<iframe title="Example video" src="${escapeHtml(
      example.vimeo
    )}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    return;
  }

  if (example.video) {
    els.embed.innerHTML = `<video src="${escapeHtml(
      example.video
    )}" controls autoplay playsinline></video>`;
    return;
  }
}

function render(i) {
  index = ((i % EXAMPLES.length) + EXAMPLES.length) % EXAMPLES.length;
  const example = EXAMPLES[index];
  stopVideo();

  els.title.textContent = example.title;
  const hasDuration = Boolean(example.duration);
  els.duration.textContent = example.duration || "—";
  els.duration.hidden = !hasDuration;
  const durationRow = els.duration.closest(".duration-row");
  if (durationRow) durationRow.hidden = !hasDuration;
  els.desc.textContent = example.description;
  els.thumb.src = example.thumb;
  els.thumb.alt = example.title;
  els.flows.innerHTML = example.flows.map(renderFlow).join("");
  syncFlowOpenState();
  bindActionScrollFades();
  els.status.textContent = `${example.title} (${index + 1} of ${EXAMPLES.length})`;

  const multi = EXAMPLES.length > 1;
  els.prev.disabled = !multi;
  els.next.disabled = !multi;
}

els.prev.addEventListener("click", () => render(index - 1));
els.next.addEventListener("click", () => render(index + 1));

function togglePlay() {
  if (playing) stopVideo();
  else playVideo();
}

els.play.addEventListener("click", (e) => {
  e.stopPropagation();
  togglePlay();
});
els.pane.addEventListener("click", () => {
  if (!playing) playVideo();
});
els.pane.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    togglePlay();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") render(index - 1);
  if (e.key === "ArrowRight") render(index + 1);
});

window.matchMedia("(max-width: 900px)").addEventListener("change", syncFlowOpenState);

render(0);

})();
</script></div>
